# cargo-deny 配置。CI 与本地执行：`cargo deny check`。
# 许可清单与特殊义务说明见 THIRD_PARTY.md。

[advisories]
version = 2
yanked = "warn"
ignore = []

[licenses]
version = 2
# 允许的 SPDX 许可（含传递依赖里实际出现的组合项）。
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSL-1.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    # webpki-root-certs 打包 Mozilla 根证书数据，CDLA-Permissive-2.0 允许
    # 无限制使用、修改与再分发，仅需保留许可/归属声明。
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = []

# 工作区 crate 不发布（license 字段已继承 workspace），不做许可检查。
[licenses.private]
ignore = true
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
# 以下重复版本都来自传递依赖（GUI/平台/加密生态各自锁定不同大版本），
# 无法在不 fork 的前提下合并；新增重复项会以 warning 暴露，发布前用
# `cargo tree -d` 复核。版本与 Cargo.lock 同步。
skip = [
    { name = "base64", version = "=0.22.1" },
    { name = "base64", version = "=0.23.1" },
    { name = "bitflags", version = "=1.3.2" },
    { name = "bitflags", version = "=2.13.2" },
    { name = "block2", version = "=0.5.1" },
    { name = "block2", version = "=0.6.2" },
    { name = "calloop", version = "=0.13.0" },
    { name = "calloop", version = "=0.14.4" },
    { name = "calloop-wayland-source", version = "=0.3.0" },
    { name = "calloop-wayland-source", version = "=0.4.1" },
    { name = "core-foundation", version = "=0.9.4" },
    { name = "core-foundation", version = "=0.10.1" },
    { name = "core-graphics", version = "=0.23.2" },
    { name = "core-graphics", version = "=0.25.0" },
    { name = "core-graphics-types", version = "=0.1.3" },
    { name = "core-graphics-types", version = "=0.2.0" },
    { name = "cpufeatures", version = "=0.2.17" },
    { name = "cpufeatures", version = "=0.3.1" },
    { name = "foldhash", version = "=0.1.5" },
    { name = "foldhash", version = "=0.2.0" },
    { name = "getrandom", version = "=0.3.4" },
    { name = "getrandom", version = "=0.4.3" },
    { name = "hashbrown", version = "=0.15.5" },
    { name = "hashbrown", version = "=0.16.1" },
    { name = "hashbrown", version = "=0.17.1" },
    { name = "itertools", version = "=0.14.0" },
    { name = "itertools", version = "=0.15.0" },
    { name = "jni-sys", version = "=0.3.1" },
    { name = "jni-sys", version = "=0.4.1" },
    { name = "linux-raw-sys", version = "=0.4.15" },
    { name = "linux-raw-sys", version = "=0.12.1" },
    { name = "miniz_oxide", version = "=0.8.9" },
    { name = "miniz_oxide", version = "=0.9.1" },
    { name = "objc2", version = "=0.5.3" },
    { name = "objc2", version = "=0.6.5" },
    { name = "objc2-app-kit", version = "=0.2.2" },

[package]
name = "fb-remote"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
license.workspace = true
publish = false
description = "Navidrome / OpenSubsonic client spike for foobar-rs"

[dependencies]
md-5 = "0.10"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "rt-multi-thread",
    "time",
] }
url = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[lints]
workspace = true

[[bin]]
name = "navidrome-probe"
path = "src/bin/navidrome-probe.rs"

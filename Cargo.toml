[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
# Defaults would also pull in microphone recording and dithering; M0 only decodes
# and plays back the formats listed in the plan.
rodio = { version = "0.23", default-features = false, features = [
    "playback",
    "wav",
    "flac",
    "mp3",
    "vorbis",
    "mp4",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
